version: "3.9"
services:

  postgres:
    image: postgres:17
    container_name: shopsphere-postgres
    restart: always

    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: shopsphere-adminer
    restart: always
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  backend:

    build:
      context: ./backend

    container_name: shopsphere-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"

  frontend:

    build:
      context: ./frontend

    container_name: shopsphere-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: